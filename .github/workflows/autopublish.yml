name: 🚀 Auto publish release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      target:
        description: Which platform to publish to
        required: true
        default: curseforge
        type: choice
        options:
          - all
          - curseforge
          - modrinth

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: 🔎 Resolve release pack
    runs-on: ubuntu-24.04
    outputs:
      minecraft_version: ${{ steps.resolve.outputs.minecraft_version }}
      pack_dir: ${{ steps.resolve.outputs.pack_dir }}
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve Minecraft version from pack version
        id: resolve
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 .github/scripts/resolve_release_version.py \
            --pack-root Packwiz \
            --version "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT"

  publish-to-curseforge:
    name: ✅ Publish to CurseForge
    needs: prepare
    if: github.repository_owner == 'dirtTW' && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'curseforge')
    runs-on: ubuntu-24.04
    environment: github-actions
    steps:
      - name: Download pack files
        uses: robinraju/release-downloader@v1.13
        id: download-files
        with:
          repository: ${{ github.repository }}
          tag: ${{ env.RELEASE_TAG }}
          fileName: "*.zip"
          tarBall: false
          zipBall: false

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          name: MC ${{ needs.prepare.outputs.minecraft_version }} DBOP v${{ env.RELEASE_TAG }}
          curseforge-id: 968954
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: "*.zip"
          loaders: fabric
          game-versions: ${{ needs.prepare.outputs.minecraft_version }}

  publish-to-modrinth:
    name: ✅ Publish to Modrinth
    needs: prepare
    if: github.repository_owner == 'dirttw' && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'modrinth')
    runs-on: ubuntu-24.04
    environment: github-actions
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Check workflow formatting
        run: npx --yes prettier@3.9.10 --check .github/workflows/autopublish.yml
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Export to packwiz
        run: |
          pushd "${{ needs.prepare.outputs.pack_dir }}"
          "$(go env GOPATH)/bin/packwiz" modrinth export -o ../../DBOP-${{ env.RELEASE_TAG }}.mrpack
          popd
      - name: Attest mrpack
        id: attest-mrpack
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: DBOP-${{ env.RELEASE_TAG }}.mrpack
      - name: Copy and zip attestation
        run: |
          cp ${{ steps.attest-mrpack.outputs.bundle-path }} cosign-bundle.json
          zip cosign-bundle.zip cosign-bundle.json
      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          name: MC ${{ needs.prepare.outputs.minecraft_version }} DBOP v${{ env.RELEASE_TAG }}
          modrinth-id: olssWAmw
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-unfeature-mode: subset
          files: DBOP-${{ env.RELEASE_TAG }}.mrpack
          loaders: fabric
          game-versions: ${{ needs.prepare.outputs.minecraft_version }}
      - name: Upload to Github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "DBOP-${{ env.RELEASE_TAG }}.mrpack" --repo "${{ github.repository }}" --clobber
