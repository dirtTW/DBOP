name: Automatically publish to Modrinth and CurseForge
on: 
  release:
    types: [published]
jobs:
  publish-to-curseforge:
    if: github.repository_owner == 'dirtTW'
    runs-on: ubuntu-24.04
    environment: github-actions
    steps:
      - name: Download pack files
        uses: robinraju/release-downloader@v1.12
        id: download-files
        with:
          fileName: "*.zip"
          latest: true
          tarBall: false
          zipBall: false
          preRelease: true

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: MC ${{ vars.MC_VERSION }} DBOP v${{ steps.download-files.outputs.tag_name }}
          curseforge-id: 968954
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: "*.zip"
          loaders: fabric
          game-versions: ${{ vars.MC_VERSION }}

  publish-to-modrinth:
    if: github.repository_owner == 'dirttw'
    runs-on: ubuntu-24.04
    environment: github-actions
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@v5
      - name: Find latest successful Packwiz build
        id: packwiz-run
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          run_id=$(gh api repos/packwiz/packwiz/actions/workflows/go.yml/runs \
            --field branch=main \
            --field per_page=20 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful Packwiz build was found." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download packwiz
        uses: actions/download-artifact@v6
        with:
          name: "Linux 64-bit x86"
          github-token: ${{ secrets.GH_PAT }}
          repository: dirttw/packwiz
          run-id: ${{ steps.packwiz-run.outputs.run_id }}
      - name: Export to packwiz
        run: |
          chmod +x ./packwiz
          pushd Packwiz/${{ vars.MC_VERSION }}
          ../../packwiz modrinth export -o ../../DBOP-${{ github.ref_name }}.mrpack
          popd
      - name: Attest mrpack
        id: attest-mrpack
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: DBOP-${{ github.ref_name }}.mrpack
      - name: Copy and zip attestation
        run: |
          cp ${{ steps.attest-mrpack.outputs.bundle-path }} cosign-bundle.json
          zip cosign-bundle.zip cosign-bundle.json
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: MC ${{ vars.MC_VERSION }} DBOP v${{ github.ref_name }}
          modrinth-id: olssWAmw
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-unfeature-mode: subset
          files: DBOP-${{ github.ref_name }}.mrpack
          loaders: fabric
          game-versions: ${{ vars.MC_VERSION }}
      - name: Upload to Github
        uses: Shopify/upload-to-release@v2.0.0
        with:
          name: DBOP-${{ github.ref_name }}.mrpack
          path: DBOP-${{ github.ref_name }}.mrpack
          repo-token: ${{ secrets.GITHUB_TOKEN }}
