name: 📦 Prepare Packwiz update or migration

on:
  schedule:
    # Daily check for a new stable Minecraft release (migration only).
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: What to prepare
        required: true
        default: migrate
        type: choice
        options:
          - migrate
          - update_existing
      minecraft_version:
        description: Stable Minecraft version (blank = latest DBOP pack)
        required: false
        type: string
      minimum_mod_updates:
        description: Minimum changed mods before opening a PR
        required: false
        default: "3"
        type: string
  workflow_call:
    inputs:
      mode:
        description: migrate or update_existing
        required: false
        default: migrate
        type: string
      minecraft_version:
        description: Stable Minecraft version (required for update_existing)
        required: false
        default: ""
        type: string
      minimum_mod_updates:
        description: Minimum changed mods before opening a PR
        required: false
        default: "3"
        type: string
    outputs:
      target_version:
        description: Minecraft version that was prepared
        value: ${{ jobs.update.outputs.target_version }}
      target_pack_version:
        description: Pack version written to pack.toml
        value: ${{ jobs.update.outputs.target_pack_version }}
      mod_updates:
        description: Number of changed mod files
        value: ${{ jobs.update.outputs.mod_updates }}
      proceed:
        description: Whether the change threshold was met
        value: ${{ jobs.update.outputs.proceed }}
      pr_branch:
        description: Branch containing the tested pack update
        value: ${{ jobs.create-pr.outputs.pr_branch }}
      pr_sha:
        description: Commit SHA of the tested pack update
        value: ${{ jobs.create-pr.outputs.pr_sha }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  update:
    name: 📦 Build updated pack
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      proceed: ${{ steps.changes.outputs.proceed }}
      target_version: ${{ steps.prepare.outputs.target_version }}
      target_pack_version: ${{ steps.prepare.outputs.target_pack_version }}
      java_version: ${{ steps.client-test-java.outputs.version }}
      mod_updates: ${{ steps.changes.outputs.mod_updates }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare migration or existing pack update
        id: prepare
        env:
          MODE: ${{ inputs.mode || 'migrate' }}
          MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
        run: python3 .github/scripts/prepare_packwiz_migration.py

      - name: Choose Java for the Minecraft client test
        id: client-test-java
        if: steps.prepare.outputs.skip != 'true'
        shell: bash
        run: |
          case "${{ steps.prepare.outputs.target_version }}" in
            1.20.1|1.20.4) echo "version=17" >> "$GITHUB_OUTPUT" ;;
            26.*) echo "version=25" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=21" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up Go
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false

      - name: Install Packwiz
        if: steps.prepare.outputs.skip != 'true'
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh pack index and capture original mod metadata
        if: steps.prepare.outputs.skip != 'true'
        working-directory: Packwiz/${{ steps.prepare.outputs.target_version }}
        env:
          SOURCE_VERSION: ${{ steps.prepare.outputs.source_version }}
        run: |
          "$(go env GOPATH)/bin/packwiz" refresh
          cp -R "../${SOURCE_VERSION}/mods" "${RUNNER_TEMP}/source-mods"

      - name: Update all compatible mods
        id: update
        if: steps.prepare.outputs.skip != 'true'
        working-directory: Packwiz/${{ steps.prepare.outputs.target_version }}
        run: |
          set +e
          "$(go env GOPATH)/bin/packwiz" --yes update --all 2>&1 | tee "${RUNNER_TEMP}/packwiz-update.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "Packwiz update failed with exit code $result; generating the report from available results." >&2
          fi
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"

      - name: Count changed mods and apply PR threshold
        id: changes
        if: steps.prepare.outputs.skip != 'true'
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.prepare.outputs.target_version }}
          MIN_UPDATES: ${{ inputs.minimum_mod_updates || '3' }}
        run: |
          count=$(git status --porcelain -- "Packwiz/${TARGET_VERSION}/mods" | grep -c '\.pw\.toml$' || true)
          echo "mod_updates=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge "${MIN_UPDATES:-3}" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate update and review report
        if: steps.prepare.outputs.skip != 'true'
        env:
          MINECRAFT_VERSION: ${{ steps.prepare.outputs.target_version }}
          SOURCE_VERSION: ${{ steps.prepare.outputs.source_version }}
          SOURCE_PACK_VERSION: ${{ steps.prepare.outputs.source_pack_version }}
          TARGET_PACK_VERSION: ${{ steps.prepare.outputs.target_pack_version }}
          PACKWIZ_EXIT_CODE: ${{ steps.update.outputs.exit_code }}
        run: |
          python3 .github/scripts/report_packwiz_updates.py \
            --source-mods "${RUNNER_TEMP}/source-mods" \
            --target-mods "Packwiz/${MINECRAFT_VERSION}/mods" \
            --log "${RUNNER_TEMP}/packwiz-update.log" \
            --output "${RUNNER_TEMP}/packwiz-update-report.md" \
            --changelog-output "Packwiz/${MINECRAFT_VERSION}/changelog.md"
          (
            cd "Packwiz/${MINECRAFT_VERSION}"
            "$(go env GOPATH)/bin/packwiz" -y refresh
          )
          cat "${RUNNER_TEMP}/packwiz-update-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update summary
        if: steps.prepare.outputs.skip != 'true'
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'migrate' }}
          TARGET_VERSION: ${{ steps.prepare.outputs.target_version }}
          TARGET_PACK_VERSION: ${{ steps.prepare.outputs.target_pack_version }}
          MOD_UPDATES: ${{ steps.changes.outputs.mod_updates }}
          MIN_UPDATES: ${{ inputs.minimum_mod_updates || '3' }}
          PROCEED: ${{ steps.changes.outputs.proceed }}
        run: |
          {
            echo "## 📦 Packwiz update"
            echo ""
            echo "- Mode: **${MODE}**"
            echo "- Minecraft: **${TARGET_VERSION}**"
            echo "- Pack version: **v${TARGET_PACK_VERSION}**"
            echo "- Changed mods: **${MOD_UPDATES}** (threshold: ${MIN_UPDATES})"
            if [ "${PROCEED}" = "true" ]; then
              echo "- ✅ Headless test and pull request will follow"
            else
              echo "- ⏭️ Skipped: not enough mod updates"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload update report
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packwiz-update-report-${{ steps.prepare.outputs.target_version }}
          path: ${{ runner.temp }}/packwiz-update-report.md

      - name: Upload updated pack for the client test
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packwiz-updated-pack-${{ steps.prepare.outputs.target_version }}
          path: Packwiz/${{ steps.prepare.outputs.target_version }}
          retention-days: 7

      - name: Mark Packwiz command failure
        if: steps.prepare.outputs.skip != 'true' && steps.update.outputs.exit_code != '0'
        run: exit 1

  client-test:
    name: 🎮 Headless Minecraft test
    needs: update
    if: needs.update.outputs.skip != 'true' && needs.update.outputs.proceed == 'true'
    uses: ./.github/workflows/minecraft-client-test.yml
    with:
      minecraft_version: ${{ needs.update.outputs.target_version }}
      java_version: ${{ needs.update.outputs.java_version }}
      pack_artifact: packwiz-updated-pack-${{ needs.update.outputs.target_version }}
      pack_artifact_path: Packwiz/${{ needs.update.outputs.target_version }}

  create-pr:
    name: ✅ Open tested update PR
    needs: [update, client-test]
    if: needs.update.outputs.skip != 'true' && needs.update.outputs.proceed == 'true' && needs.client-test.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      pr_branch: ${{ steps.pr.outputs.pull-request-branch }}
      pr_sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Replace checked-out pack with tested artifact
        run: rm -rf "Packwiz/${{ needs.update.outputs.target_version }}"

      - name: Download tested pack
        uses: actions/download-artifact@v8
        with:
          name: packwiz-updated-pack-${{ needs.update.outputs.target_version }}
          path: Packwiz/${{ needs.update.outputs.target_version }}

      - name: Create update label
        id: label
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'migrate' }}
          TARGET_VERSION: ${{ needs.update.outputs.target_version }}
          PACK_VERSION: ${{ needs.update.outputs.target_pack_version }}
        run: |
          prefix=migrate
          if [ "${MODE}" = "update_existing" ]; then prefix=update; fi
          label="${prefix}:${TARGET_VERSION}-DBOP-v${PACK_VERSION}"
          gh label create "${label}" --color 1D76DB --force
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Open review pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: Packwiz/${{ needs.update.outputs.target_version }}/
          branch: bot/${{ steps.label.outputs.prefix }}-${{ needs.update.outputs.target_version }}-v${{ needs.update.outputs.target_pack_version }}
          delete-branch: true
          labels: ${{ steps.label.outputs.label }}
          title: ${{ inputs.mode == 'update_existing' && 'update:' || 'migrate:' }} ${{ needs.update.outputs.target_version }} DBOP v${{ needs.update.outputs.target_pack_version }}
          commit-message: ${{ inputs.mode == 'update_existing' && 'update:' || 'migrate:' }} ${{ needs.update.outputs.target_version }} DBOP v${{ needs.update.outputs.target_pack_version }}
          body: |
            ## ✅ Tested pack ${{ inputs.mode == 'update_existing' && 'update' || 'migration' }}

            - **Mode:** `${{ steps.label.outputs.prefix }}`
            - **Minecraft:** `${{ needs.update.outputs.target_version }}`
            - **Pack version:** `v${{ needs.update.outputs.target_pack_version }}`
            - **Changed mods:** `${{ needs.update.outputs.mod_updates }}`
            - **Label:** `${{ steps.label.outputs.label }}`
            - **Headless test:** ✅ passed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The pack layout was changed through `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}` and the real Minecraft client test completed before this PR was opened.

            After merging, run **✅ Minecraft Fabric client test** manually from Actions if you want a post-merge verification run. Publishing remains a separate release step.
